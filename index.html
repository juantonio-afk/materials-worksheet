function makeQuestion(en,es,icon,answer,options,whyEn,whyEs,category,spoken){return{en,es,icon,answer,options:shuffle([...new Set(options)]),whyEn,whyEs,category,spoken:spoken||en}}
function fourChoices(answer,pool){return shuffle([answer,...shuffle(pool.filter(x=>x!==answer)).slice(0,3)])}
const materialIds=materials.map(m=>m.id);
function materialQuestion(o){return makeQuestion('In our worksheet, what material is the '+o.en+' made of?','Según nuestra guía, ¿de qué material es '+o.es+'?',o.icon,o.material,fourChoices(o.material,materialIds),'The worksheet lists the '+o.en+' as an example of '+o.material+'.','La guía menciona '+o.es+' como ejemplo de '+materialSpanish(o.material)+'.','objects','What material is the '+o.en+' made of?')}
function materialSpanish(id){return({wood:'madera',glass:'vidrio',metal:'metal',plastic:'plástico',rubber:'goma','rubber or plastic':'goma o plástico'})[id]||id}
function propertyQuestions(){const ids=properties.map(p=>p.id);return properties.map(p=>makeQuestion('Which property means: '+p.defEn,'¿Qué propiedad significa: '+p.defEs+'?',p.icon,p.id,fourChoices(p.id,ids),p.en+': '+p.defEn,p.es+': '+p.defEs,'properties','Which property means '+p.defEn))}
function sensesQuestions(){const a=textures.map(t=>makeQuestion('How would you describe a '+t.sampleEn+'?','¿Cómo describirías '+t.sampleEs+'?',t.icon,t.id,fourChoices(t.id,textures.map(x=>x.id)),'The worksheet uses '+t.sampleEn+' as an example of '+t.en.toLowerCase()+'.','La guía muestra '+t.sampleEs+' como ejemplo de '+t.es.toLowerCase()+'.','senses','How would you describe a '+t.sampleEn+'?'));
a.push(makeQuestion('Which sense helps you identify texture?','¿Qué sentido ayuda a identificar la textura?','🖐️','touch',['touch','sight','hearing','smell'],'We use touch to feel texture.','Usamos el tacto para sentir la textura.','senses'));
a.push(makeQuestion('Which sense helps you identify colour?','¿Qué sentido ayuda a identificar el color?','👀','sight',['sight','touch','taste','hearing'],'We use our eyes to see colour.','Usamos los ojos para ver los colores.','senses'));
a.push(makeQuestion('What shape is a circle?','¿Qué forma tiene un círculo?','⚪','round',['round','square','pointed','flat'],'A circle is round.','Un círculo es redondo.','senses'));
a.push(makeQuestion('What shape has four equal sides?','¿Qué forma tiene cuatro lados iguales?','🟦','square',['round','square','pointed','long'],'A square has four equal sides.','Un cuadrado tiene cuatro lados iguales.','senses'));
a.push(makeQuestion('Which word describes a needle tip?','¿Qué palabra describe la punta de una aguja?','📍','pointed',['flat','square','pointed','round'],'A needle tip is pointed.','La punta de una aguja es puntiaguda.','senses'));
return a}
function appliedQuestions(){return[
makeQuestion('A window is…','Una ventana es…','🪟','transparent',['transparent','opaque'],'You can see through a window.','Puedes ver a través de una ventana.','properties'),
makeQuestion('A rubber band is…','Una banda elástica es…','🎀','flexible',['flexible','rigid'],'It can bend without breaking.','Se puede doblar sin romperse.','properties'),
makeQuestion('A metal spoon is…','Una cuchara de metal es…','🥄','hard',['hard','soft'],'Metal is hard.','El metal es duro.','properties'),
makeQuestion('A glass cup can break easily. It is…','Un vaso de vidrio se puede romper fácilmente. Es…','🥛','fragile',['fragile','strong'],'Glass can break easily.','El vidrio puede romperse fácilmente.','properties'),
makeQuestion('Rain boots keep water out. They are…','Las botas de lluvia no dejan pasar agua. Son…','🥾','waterproof',['waterproof','transparent'],'Rubber boots are waterproof.','Las botas de goma son impermeables.','properties'),
makeQuestion('Wood cannot be seen through. It is…','No podemos ver a través de la madera. Es…','🪵','opaque',['opaque','transparent'],'Wood is opaque.','La madera es opaca.','properties'),
makeQuestion('A wooden ruler does not bend. It is…','Una regla de madera no se dobla. Es…','📏','rigid',['rigid','flexible'],'A wooden ruler is rigid.','Una regla de madera es rígida.','properties')
]}
function problemQuestions(){return situations.map(s=>makeQuestion(s.en,s.es,s.icon,s.right, s.options||fourChoices(s.right,materialIds),s.whyEn,s.whyEs,'problems',s.en))}
function trueFalseQuestions(){const statements=[
['Wood comes from trees.','La madera viene de los árboles.',true,'Wood comes from trees.','La madera viene de los árboles.','🪵'],
['Glass is made from sand heated very hot.','El vidrio se fabrica con arena muy caliente.',true,'Glass comes from sand heated very hot.','El vidrio proviene de arena calentada a temperatura muy alta.','🥛'],
['Metal comes from the Earth.','El metal proviene de la Tierra.',true,'Metal comes from the Earth.','El metal proviene de la Tierra.','🔩'],
['Rubber can come from rubber trees.','La goma puede venir de árboles de caucho.',true,'Rubber can be natural or made in factories.','La goma puede ser natural o fabricada.','🛞'],
['A window made of glass is opaque.','Una ventana de vidrio es opaca.',false,'Window glass is transparent.','El vidrio de una ventana es transparente.','🪟'],
['A rubber band is rigid.','Una banda elástica es rígida.',false,'A rubber band is flexible.','Una banda elástica es flexible.','🎀'],
['A glass cup is fragile.','Un vaso de vidrio es frágil.',true,'Glass can break easily.','El vidrio puede romperse con facilidad.','🥛'],
['Wood can be strong and hard.','La madera puede ser fuerte y dura.',true,'Wood is listed as hard and strong.','La madera aparece como dura y resistente.','🪵'],
['Waterproof means water goes through.','Impermeable significa que el agua pasa a través.',false,'Waterproof means water does NOT go through.','Impermeable significa que el agua NO pasa.','💧'],
['Transparent means you can see through it.','Transparente significa que puedes ver a través.',true,'This is the meaning of transparent.','Ese es el significado de transparente.','🪟'],
['A metal key is soft.','Una llave de metal es blanda.',false,'Metal keys are hard.','Las llaves de metal son duras.','🔑'],
['A mirror can be shiny.','Un espejo puede ser brillante.',true,'The worksheet calls a mirror shiny.','La guía usa un espejo como ejemplo de brillante.','🪞']
];return statements.map(x=>makeQuestion(x[0],x[1],x[5],x[2]?'True':'False',['True','False'],x[3],x[4],'truefalse',x[0]))}
function makeQuiz(id){const o=objects.map(materialQuestion),p=[...propertyQuestions(),...appliedQuestions()],s=sensesQuestions(),b=problemQuestions(),t=trueFalseQuestions();if(id==='objects')return shuffle(o);if(id==='senses')return shuffle(s);if(id==='power')return shuffle(p);if(id==='problems')return shuffle(b);if(id==='truefalse')return shuffle(t);if(id==='exam')return shuffle([...shuffle(o).slice(0,5),...shuffle(p).slice(0,6),...shuffle(s).slice(0,4),...shuffle(b).slice(0,5)]);return []}
function choiceLabel(choice){const m=materials.find(x=>x.id===choice);const p=properties.find(x=>x.id===choice);if(m)return '<span>'+m.icon+' '+m.en+(language==='es'?'<small class="muted"> · '+m.es+'</small>':'')+'</span>';if(p)return '<span>'+p.en+(language==='es'?'<small class="muted"> · '+p.es+'</small>':'')+'</span>';if(choice==='True'||choice==='False')return '<span>'+choice+(language==='es'?' · '+(choice==='True'?'Verdadero':'Falso'):'')+'</span>';if(choice==='rubber or plastic')return '<span>Rubber / Plastic'+(language==='es'?' · Goma / Plástico':'')+'</span>';return esc(choice)}
function showQuiz(){const q=quizItems[quizIndex],exam=quizMode==='exam',answered=quizPick!==null;const title=(menu.find(x=>x.id===quizMode)||{});let feedback='';if(answered){if(exam)feedback='<div class="feedback note">'+tx('✓ Answer recorded. Keep going!','✓ Respuesta registrada. ¡Sigue adelante!')+'</div>';else{const good=quizPick===q.answer;feedback='<div class="feedback '+(good?'good':'bad')+'">'+(good?tx('🎉 Great job!','🎉 ¡Muy bien!'):tx('💡 Correct answer: ','💡 Respuesta correcta: ')+choiceLabel(q.answer))+'<div class="small" style="margin-top:7px">'+esc(tx(q.whyEn,q.whyEs))+'</div></div>'}}
let options=q.options.map((o,i)=>{let cls='choice';if(answered&&!exam){if(o===q.answer)cls+=' right';else if(o===quizPick)cls+=' wrong'}else if(answered&&o===quizPick)cls+=' marked';return '<button class="'+cls+'" data-action="answer" data-index="'+i+'" '+(answered?'disabled':'')+'>'+choiceLabel(o)+'</button>'}).join('');
app.innerHTML=toolbar()+'<section class="card">'+backBar((quizIndex+1)+' / '+quizItems.length)+'<h2>'+tx(title.en,title.es)+'</h2>'+meter(quizIndex+(answered?1:0),quizItems.length)+'<div class="bigpic">'+q.icon+'</div><div class="question">'+esc(tx(q.en,q.es))+'</div><div class="choices">'+options+'</div>'+feedback+'<div class="actions">'+button('speak',tx('🔊 Listen in English','🔊 Escuchar en inglés'),'secondary')+(answered?button('nextQuestion',quizIndex===quizItems.length-1?tx('See results 🏆','Ver resultados 🏆'):tx('Next →','Siguiente →')):'')+'</div></section>'}
function selectAnswer(i){if(quizPick!==null)return;const q=quizItems[quizIndex];quizPick=q.options[i];const correct=quizPick===q.answer;if(correct){quizScore++;award()}else{quizReview.push({...q,picked:quizPick})}render()}

app.innerHTML=toolbar()+'<section class="card"><div class="trophy">'+(percentage>=85?'🏆':percentage>=60?'🌟':'💪')+'</div><h2 class="center">'+tx('Great work, ','¡Buen trabajo, ')+esc(student)+'!</h2><div class="resultbig">'+r.score+' / '+r.total+'</div><p class="center lead">'+(percentage>=85?tx('You are a super scientist!','¡Eres un súper científico!'):percentage>=60?tx('Well done! Keep practising.','¡Muy bien! Sigue practicando.'):tx('Keep trying. You are learning!','Sigue intentando. ¡Estás aprendiendo!'))+'</p>'+(r.mode==='exam'?'<p class="center muted">🏆 '+tx('Best practice test: ','Mejor simulacro: ')+progress.best+'/20</p>':'')+review+'<div class="actions">'+button('home',tx('🏠 Home','🏠 Inicio'))+button('repeat',tx('↻ Play again','↻ Jugar de nuevo'),'secondary')+'</div></section>'}
const matchSets=[['chair','window','key','toy','tire'],['door','glass cup','fork','bottle','eraser'],['pencil','jar','coin','bucket','rain boots']];
let matchMaterialsOrder=shuffle(materialIds);
function showMatch(){const labels=matchSets[matchRound];const arr=labels.map(en=>objects.find(o=>o.en===en));const allDone=matchDone.length===5;let feedback='';if(matchFeedback==='wrong')feedback='<div class="feedback bad">'+tx('Not quite. Try another material.','Casi. Prueba con otro material.')+'</div>';if(matchFeedback==='good')feedback='<div class="feedback good">'+tx('Great match! ⭐','¡Bien relacionado! ⭐')+'</div>';

function matchMaterial(id){if(matchSelected===null)return;const o=objects.find(x=>x.en===matchSets[matchRound][matchSelected]);if(o.material===id){matchDone.push(matchSelected);matchSelected=null;matchFeedback='good';matchScore++;award()}else matchFeedback='wrong';render()}
function nextMatch(){if(matchRound===2){lastResult={mode:'match',score:matchScore,total:15,review:[]};complete('match');view='result'}else{matchRound++;matchDone=[];matchSelected=null;matchFeedback='';matchMaterialsOrder=shuffle(materialIds)}render();window.scrollTo(0,0)}
function showExperiment(){const results=progress.experiment||{};function select(id,field,options){const selected=(results[id]||{})[field]||'';return '<select data-observe="'+id+'" data-field="'+field+'"><option value="">'+tx('Choose','Elegir')+'</option>'+options.map(o=>'<option value="'+o+'" '+(selected===o?'selected':'')+'>'+({yes:tx('Yes','Sí'),no:tx('No','No'),hard:tx('Hard','Duro'),soft:tx('Soft','Blando')}[o]||o)+'</option>').join('')+'</select>'};const all=labThings.every(x=>{const v=results[x.id]||{};return v.bend&&v.see&&v.feel});app.innerHTML=toolbar()+'<section class="card">'+backBar('🧪')+'<h2>'+tx('Real-Life Laboratory','Laboratorio en casa')+'</h2><p class="lead">'+tx('Find these three real objects if you can. Carefully observe them, then record what YOU notice.','Busca estos tres objetos reales si puedes. Obsérvalos con cuidado y registra lo que TÚ notas.')+'</p><div class="hint">'+tx('No automatic right or wrong here: the answer depends on the actual object. Ask an adult to help.','Aquí no hay correcto o incorrecto automático: depende del objeto real. Pide ayuda a un adulto.')+'</div>'+labThings.map(o=>'<div class="labcard"><h3>'+o.icon+' '+tx(o.en,o.es)+'</h3><div class="labfields"><div class="field"><label>'+tx('Can I bend it?','¿Puedo doblarlo?')+'</label>'+select(o.id,'bend',['yes','no'])+'</div><div class="field"><label>'+tx('Can I see through it?','¿Puedo ver a través?')+'</label>'+select(o.id,'see',['yes','no'])+'</div><div class="field"><label>'+tx('Hard or soft?','¿Duro o blando?')+'</label>'+select(o.id,'feel',['hard','soft'])+'</div></div></div>').join('')+'<div class="actions">'+button('saveExperiment',tx('💾 Save observations','💾 Guardar observaciones'),'primary',all?'':'disabled')+'</div><p class="note center">'+tx('These observations are saved only on your device.','Estas observaciones se guardan solo en tu dispositivo.')+'</p></section>'}
function showMystery(){const d=progress.mystery||{object:'',material:'',colour:'',shape:'',texture:''};const colours=['red','blue','green','yellow','black','white','brown','clear'];const shapes=['round','square','long','pointed','flat'];const t=textures.map(x=>x.id);const option=(value,label)=>'<option value="'+esc(value)+'">'+esc(label)+'</option>';function select(field,values,caption){return '<div class="field"><label>'+caption+'</label><select data-creative="'+field+'"><option value="">'+tx('Choose','Elegir')+'</option>'+values.map(v=>option(v,v.charAt(0).toUpperCase()+v.slice(1))).join('')+'</select></div>'}app.innerHTML=toolbar()+'<section class="card">'+backBar('🎨')+'<h2>'+tx('My Mystery Object','Mi objeto misterioso')+'</h2><p class="lead">'+tx('Choose an object at home. Describe its material, colour, shape and texture. Then draw it!','Elige un objeto de tu casa. Describe su material, color, forma y textura. ¡Después dibújalo!')+'</p><div class="formgrid"><div class="field"><label>'+tx('Object name in English','Nombre del objeto en inglés')+'</label><input id="mysteryObject" maxlength="45" placeholder="'+tx('e.g. chair','p. ej. chair')+'" value="'+esc(d.object)+'"></div>'+select('material',materialIds,tx('Material','Material'))+select('colour',colours,tx('Colour','Color'))+select('shape',shapes,tx('Shape','Forma'))+select('texture',t,tx('Texture','Textura'))+'</div><div class="hint" id="mysterySentence">'+tx('Your English description will appear here.','Tu descripción en inglés aparecerá aquí.')+'</div><h3>✏️ '+tx('Draw here!','¡Dibuja aquí!')+'</h3><canvas id="drawPad" class="drawpad" width="760" height="265" aria-label="Drawing area"></canvas><div class="actions">'+button('clearDrawing',tx('🧽 Clear drawing','🧽 Borrar dibujo'),'secondary')+button('saveMystery',tx('💾 Save description','💾 Guardar descripción'))+'</div><p class="note">'+tx('The description is saved on this device. Your drawing is temporary and will disappear if you close the page.','La descripción se guarda en este dispositivo. El dibujo es temporal y desaparecerá al cerrar la página.')+'</p></section>';for(const el of app.querySelectorAll('[data-creative]'))el.value=d[el.dataset.creative]||'';initDrawing();updateMysterySentence()}
function mysteryData(){const obj=app.querySelector('#mysteryObject');const data={object:obj?obj.value.trim():'',material:'',colour:'',shape:'',texture:''};app.querySelectorAll('[data-creative]').forEach(el=>data[el.dataset.creative]=el.value);return data}
function updateMysterySentence(){const d=mysteryData(),el=document.getElementById('mysterySentence');if(!el)return;let s='This is a '+(d.object||'...')+'. It is made of '+(d.material||'...')+'. It is '+(d.colour||'...')+', '+(d.shape||'...')+' and '+(d.texture||'...')+'.';el.textContent=s}
function initDrawing(){const c=document.getElementById('drawPad');if(!c)return;const ctx=c.getContext('2d');if(!ctx)return;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#137c85';ctx.lineWidth=4;if(drawSnapshot){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,c.width,c.height);img.src=drawSnapshot}let drawing=false;const point=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;c.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});const done=()=>{if(!drawing)return;drawing=false;drawSnapshot=c.toDataURL('image/png')};c.addEventListener('pointerup',done);c.addEventListener('pointercancel',done)}
function saveMystery(){const d=mysteryData();if(!d.object||!d.material||!d.colour||!d.shape||!d.texture){alert(tx('Please complete all five fields.','Completa los cinco campos.'));return}const first=!progress.completed.mystery;progress.mystery=d;complete('mystery');if(first)award();alert(tx('Your object description is saved on this device!','¡Tu descripción se guardó en este dispositivo!'))}
function render(){updateStars();if(!student){showWelcome();return}if(view==='home')showHome();else if(view==='lesson')showLesson();else if(view==='quiz')showQuiz();else if(view==='result')showResult();else if(view==='match')showMatch();else if(view==='experiment')showExperiment();else if(view==='mystery')showMystery();else showHome()}
app.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='lang'){language=b.dataset.lang==='es'?'es':'en';saveSession();render();return}if(a==='switch'){student='';progress={stars:0,best:0,completed:{},experiment:{},mystery:null};view='welcome';saveSession();render();return}if(a==='home'){view='home';render();return}if(a==='start'){start(b.dataset.id);return}if(a==='speak'){if(view==='lesson'){const item=(lessonType==='materials'?materials:properties)[lessonIndex];speak(item.en+(lessonType==='properties'?'. '+item.defEn:'. '+item.originEn))}else if(view==='quiz')speak(quizItems[quizIndex].spoken);return}if(a==='nextCard'){const list=lessonType==='materials'?materials:properties;if(lessonIndex===list.length-1){complete(lessonType);view='home'}else lessonIndex++;render();return}if(a==='previousCard'){if(lessonIndex>0)lessonIndex--;render();return}if(a==='answer'){selectAnswer(Number(b.dataset.index));return}if(a==='nextQuestion'){nextQuestion();return}if(a==='repeat'){start(lastResult.mode);return}if(a==='matchObject'){const i=Number(b.dataset.index);if(!matchDone.includes(i)){matchSelected=i;matchFeedback='';render()}return}if(a==='matchMaterial'){matchMaterial(b.dataset.id);return}if(a==='nextMatch'){nextMatch();return}if(a==='saveExperiment'){const x=progress.completed.experiment;if(!x)award();complete('experiment');alert(tx('Saved! Great observations, scientist!','¡Guardado! ¡Excelentes observaciones!'));return}if(a==='saveMystery'){saveMystery();return}if(a==='clearDrawing'){drawSnapshot='';const c=document.getElementById('drawPad');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);return}});
app.addEventListener('change',event=>{const el=event.target;if(el.dataset.observe){const id=el.dataset.observe;progress.experiment[id]=progress.experiment[id]||{};progress.experiment[id][el.dataset.field]=el.value;saveProfile();const all=labThings.every(x=>{const v=progress.experiment[x.id]||{};return v.bend&&v.see&&v.feel});const b=app.querySelector('[data-action="saveExperiment"]');if(b)b.disabled=!all}if(el.dataset.creative)updateMysterySentence()});
app.addEventListener('input',event=>{if(event.target.id==='mysteryObject')updateMysterySentence()});
app.addEventListener('submit',event=>{if(event.target.id!=='nameForm')return;event.preventDefault();const input=document.getElementById('studentName');const value=input.value.trim();if(!value)return;student=value;loadProfile();view='home';saveSession();render()});
const previous=read(KEY+':session',{});if(typeof previous.student==='string'&&previous.student.trim()){student=previous.student.trim();language=previous.language==='es'?'es':'en';loadProfile();view='home'}else if(previous.language==='es')language='es';render();
})();
</script>
